<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>New Portfolio Message</title>
</head>
<body style="margin: 0; padding: 0; background-color: #08090a; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; color: #f0f0f0;">
  <table role="presentation" width="100%" border="0" cellspacing="0" cellpadding="0" style="background-color: #08090a; padding: 40px 15px;">
    <tr>
      <td align="center">
        <!-- Main Container -->
        <table role="presentation" width="100%" border="0" cellspacing="0" cellpadding="0" style="max-width: 580px; background: #0f1013; border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 24px; box-shadow: 0 20px 50px rgba(0,0,0,0.6); overflow: hidden;">
          
          <!-- Header Banner -->
          <tr>
            <td style="padding: 32px 36px 20px 36px; background: linear-gradient(180deg, rgba(164, 245, 100, 0.08) 0%, rgba(15, 16, 19, 0) 100%); border-bottom: 1px solid rgba(255, 255, 255, 0.08);">
              <table role="presentation" width="100%" border="0" cellspacing="0" cellpadding="0">
                <tr>
                  <td>
                    <!-- Badge -->
                    <span style="display: inline-block; padding: 5px 14px; background: rgba(164, 245, 100, 0.12); border: 1px solid rgba(164, 245, 100, 0.35); border-radius: 999px; font-size: 11px; font-weight: 700; color: #a4f564; letter-spacing: 0.08em; text-transform: uppercase;">
                      ⚡ New Inquiry • Portfolio
                    </span>
                    <h1 style="margin: 16px 0 6px 0; font-size: 24px; font-weight: 700; color: #ffffff; letter-spacing: -0.02em;">
                      New Message Received
                    </h1>
                    <p style="margin: 0; font-size: 14px; color: #8e8f96; line-height: 1.5;">
                      Someone submitted the contact form on your portfolio website.
                    </p>
                  </td>
                </tr>
              </table>
            </td>
          </tr>

          <!-- Contact Details Card -->
          <tr>
            <td style="padding: 28px 36px 12px 36px;">
              <table role="presentation" width="100%" border="0" cellspacing="0" cellpadding="0" style="background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 16px; padding: 20px;">
                <tr>
                  <td style="padding-bottom: 14px;">
                    <div style="font-size: 11px; font-weight: 600; color: #a4f564; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 4px;">Sender Name</div>
                    <div style="font-size: 16px; font-weight: 600; color: #ffffff;">{{from_name}}</div>
                  </td>
                </tr>
                <tr>
                  <td style="padding-bottom: 14px; border-top: 1px solid rgba(255, 255, 255, 0.06); padding-top: 14px;">
                    <div style="font-size: 11px; font-weight: 600; color: #a4f564; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 4px;">Email Address</div>
                    <div style="font-size: 15px; font-weight: 500; color: #e2e2e5;">
                      <a href="mailto:{{from_email}}" style="color: #a4f564; text-decoration: none;">{{from_email}}</a>
                    </div>
                  </td>
                </tr>
              </table>
            </td>
          </tr>

          <!-- Message Body Card -->
          <tr>
            <td style="padding: 12px 36px 28px 36px;">
              <div style="font-size: 11px; font-weight: 600; color: #8e8f96; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 8px;">Message Content</div>
              <div style="background: #15171c; border-left: 3px solid #a4f564; border-top: 1px solid rgba(255, 255, 255, 0.08); border-right: 1px solid rgba(255, 255, 255, 0.08); border-bottom: 1px solid rgba(255, 255, 255, 0.08); border-radius: 4px 14px 14px 4px; padding: 18px 20px; font-size: 15px; line-height: 1.6; color: #f0f0f0; white-space: pre-wrap;">{{message}}</div>
            </td>
          </tr>

          <!-- Action Button -->
          <tr>
            <td align="center" style="padding: 0 36px 32px 36px;">
              <a href="mailto:{{from_email}}?subject=Re:%20Inquiry%20via%20Portfolio" style="display: inline-block; background: #a4f564; color: #0c0d0e; font-size: 14px; font-weight: 700; text-decoration: none; padding: 13px 32px; border-radius: 999px; box-shadow: 0 0 25px rgba(164, 245, 100, 0.35); letter-spacing: 0.02em;">
                Reply Directly to {{from_name}} →
              </a>
            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td style="padding: 20px 36px; background: rgba(0, 0, 0, 0.3); border-top: 1px solid rgba(255, 255, 255, 0.06); text-align: center;">
              <p style="margin: 0; font-size: 12px; color: #5a5c66;">
                Satyam Singh Portfolio • Automated System Notification
              </p>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</body>
</html>
